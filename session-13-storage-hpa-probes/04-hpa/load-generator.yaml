apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: hpa-load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - while true; do wget -q -O- http://hpa-demo-service >/dev/null; done
