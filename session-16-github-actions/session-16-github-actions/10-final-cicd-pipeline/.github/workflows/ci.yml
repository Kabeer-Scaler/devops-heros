name: Final CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Display Python version
        run: python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -v
  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Show build output
        run: |
          cat build/build-info.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/
      - name: Build container image
        run: docker build -t session16-calculator:${{ github.sha }} .
      - name: Export container artifact
        run: docker save session16-calculator:${{ github.sha }} -o build/session16-calculator.tar
      - name: Upload container artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-image
          path: build/session16-calculator.tar
  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Check for sensitive files
        run: |
          echo "Checking repository for common sensitive files..."
          if find . -type f \( \
            -name ".env" \
            -o -name "*.pem" \
            -o -name "*.key" \
          \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          else
            echo "No common sensitive files found."
          fi
  deploy-demo:
    name: CD Smoke Test
    needs:
      - build
      - security-check
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: build
      - name: Download container artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-image
          path: build
      - name: Load delivered image
        run: docker load -i build/session16-calculator.tar
      - name: Run delivered image
        run: docker run --name session16-demo session16-calculator:${{ github.sha }}
      - name: Verify deployment result
        run: docker inspect session16-demo --format '{{.State.Status}} {{.State.ExitCode}}'
